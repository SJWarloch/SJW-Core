<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Subversive Joy Works password.">
    <title>Reset password · Subversive Joy Works</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="/" aria-label="Subversive Joy Works home">
                <img class="brand__mark" src="/assets/sjw-logo.png" alt="">
                <span class="brand__name">Subversive Joy Works</span>
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a id="accountNavLink" class="button button--secondary button--small" href="/login.html">Sign in</a>
            </nav>
        </div>
    </header>

    <main class="page-main page-main--narrow">
        <div class="shell shell--small">
            <section class="panel">
                <div class="panel__heading">
                    <p class="eyebrow">Account recovery</p>
                    <h1>Reset password</h1>
                    <p id="resetStatus">Verifying your recovery link…</p>
                </div>

                <div id="resetSection" class="form-stack" hidden>
                    <label class="field">
                        <span>New password</span>
                        <input id="newPassword" type="password" minlength="8" autocomplete="new-password">
                    </label>
                    <label class="field">
                        <span>Confirm new password</span>
                        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password">
                    </label>
                    <button id="updatePasswordBtn" class="button button--primary" type="button">Update password</button>
                </div>

                <div id="resetResult" class="status-message" hidden aria-live="polite"></div>

                <div class="panel__footer">
                    <a class="text-link" href="/login.html">Return to sign in</a>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/site-header.js"></script>
    <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
