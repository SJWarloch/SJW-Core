<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SJW Core Password Reset</title>
</head>
<body>

    <h1>Subversive Joy Works</h1>
    <h2>Reset Password</h2>

    <p id="status">
        Verifying password-reset link...
    </p>


    <div
        id="resetSection"
        style="display:none;"
    >

        <p>
            <label>
                New password:
                <br>
                <input
                    id="newPassword"
                    type="password"
                    size="40"
                    minlength="8"
                    autocomplete="new-password"
                >
            </label>
        </p>

        <p>
            <label>
                Confirm new password:
                <br>
                <input
                    id="confirmPassword"
                    type="password"
                    size="40"
                    minlength="8"
                    autocomplete="new-password"
                >
            </label>
        </p>

        <button id="updatePasswordBtn">
            Update Password
        </button>

        <p id="result"></p>

    </div>


    <p>
        <a href="/">
            Return to SJW Core
        </a>
    </p>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://ersyehphlrwpdidagqvt.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_8v5kG8lwO8rsXOp_50wjaA_fcV1PfEh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const status =
            document.getElementById("status");

        const resetSection =
            document.getElementById("resetSection");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const updatePasswordBtn =
            document.getElementById("updatePasswordBtn");

        const result =
            document.getElementById("result");


        let recoverySessionReady =
            false;


        // Supabase emits PASSWORD_RECOVERY after consuming a
        // valid password-reset link.

        supabaseClient.auth.onAuthStateChange(
            (event, session) => {

                if (
                    event === "PASSWORD_RECOVERY" &&
                    session
                ) {

                    recoverySessionReady =
                        true;

                    status.textContent =
                        "Password-reset link verified.";

                    resetSection.style.display =
                        "block";
                }
            }
        );


        updatePasswordBtn.addEventListener(
            "click",
            async () => {

                result.textContent =
                    "";


                if (!recoverySessionReady) {

                    result.textContent =
                        "The password-reset session is not ready.";

                    return;
                }


                const password =
                    newPassword.value;

                const confirmation =
                    confirmPassword.value;


                if (password.length < 8) {

                    result.textContent =
                        "Password must contain at least 8 characters.";

                    return;
                }


                if (password !== confirmation) {

                    result.textContent =
                        "Passwords do not match.";

                    return;
                }


                updatePasswordBtn.disabled =
                    true;


                const { error } =
                    await supabaseClient.auth
                        .updateUser({
                            password
                        });


                updatePasswordBtn.disabled =
                    false;


                if (error) {

                    result.textContent =
                        "Unable to update password: " +
                        error.message;

                    return;
                }


                newPassword.value =
                    "";

                confirmPassword.value =
                    "";


                status.textContent =
                    "Password updated successfully.";

                result.textContent =
                    "You can now return to SJW Core and sign in with your new password.";

                resetSection.style.display =
                    "none";
            }
        );

    </script>

</body>
</html>
